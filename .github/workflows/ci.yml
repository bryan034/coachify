name: elo CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database-artifacts:
    name: Reject committed database artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked paths for MongoDB backups and data files
        shell: bash
        run: |
          artifacts=$(git ls-files -- \
            ':(icase,glob)**/mongo-data/**' ':(icase,glob)**/WiredTiger*' \
            ':(icase,glob)**/*.wt' ':(icase,glob)**/*.bson' \
            ':(icase,glob)**/*mongo*backup*.tgz' ':(icase,glob)**/*mongo*backup*.tar*' \
            ':(icase,glob)**/*mongo*backup*.zip' ':(icase,glob)**/*mongo*backup*.archive*' \
            ':(icase,glob)**/*mongo*dump*.archive*')
          if [[ -n "$artifacts" ]]; then
            printf '%s\n' 'Database artifacts are tracked:' "$artifacts" >&2
            exit 1
          fi

  frontend-unit:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint:skills-profile --workspace apps/frontend
      - run: npm run typecheck --workspace apps/frontend
      - run: npm run test --workspace apps/frontend

  frontend-e2e:
    name: Frontend browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/frontend
      - run: npm run test:e2e --workspace apps/frontend
        env:
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: test-client.apps.googleusercontent.com
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            apps/frontend/playwright-report/
            apps/frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  lint:
    name: Lint (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        service: [career]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/lint/requirements.txt
      - run: python -m pytest tools/lint
      - run: python tools/lint/quickfix_check.py services/${{ matrix.service }}-service

  backend:
    name: Backend tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TIKTOKEN_CACHE_DIR: /tmp/elo-tiktoken
    strategy:
      fail-fast: false
      matrix:
        service: [profile, cv, career, assessment, roadmap, jobs, socials, dashboard, review]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ../../packages/elo-shared -e '.[test]'
      - if: matrix.service == 'cv'
        run: |
          python -m pip install -e '.[lint]'
          python -m ruff check app
      - name: Run shared package tests
        if: matrix.service == 'assessment'
        run: python -m pytest ../../packages/elo-shared/tests
      - name: Provision Career tokenizer before test network isolation
        if: matrix.service == 'career'
        run: python -c "import tiktoken; tiktoken.get_encoding('o200k_harmony')"
      - name: Run pytest (only unimplemented services may have empty suites)
        shell: bash
        run: |
          status=0
          python -m pytest || status=$?
          if [ "$status" -eq 5 ] && [[ '${{ matrix.service }}' =~ ^review$ ]]; then
            echo "No pytest tests collected; passing this service."
            exit 0
          fi
          exit "$status"

  static-analysis:
    name: Static analysis (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [roadmap]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ../../packages/elo-shared -e '.[lint]'
      - name: Ruff (unused arguments, nested imports, swallowed exceptions)
        run: python -m ruff check app
      - name: Vulture (unused code)
        run: python -m vulture

  unused-code:
    name: Unused code (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        service: [profile, cv, career, assessment, jobs, socials, dashboard, review]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install vulture==2.16
      - name: Vulture (unused code)
        run: python -m vulture

  profile-integration:
    name: Profile MongoDB integration
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:8.2
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20 --ulimit nofile=16384:16384
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ../../packages/elo-shared -e '.[test]'
        working-directory: services/profile-service
      - run: python -m pytest
        working-directory: services/profile-service
        env:
          MONGODB_TEST_URI: mongodb://localhost:27017

  analysis-integration:
    name: Service MongoDB contracts (${{ matrix.service }})
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      TIKTOKEN_CACHE_DIR: /tmp/elo-tiktoken
    strategy:
      fail-fast: false
      matrix:
        service: [career, cv, jobs, socials]
    services:
      mongodb:
        image: mongo:8.2
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20 --ulimit nofile=16384:16384
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis test dependencies
        working-directory: services/${{ matrix.service }}-service
        run: python -m pip install -e ../../packages/elo-shared -e '.[test]'
      - name: Provision Career tokenizer before test network isolation
        if: matrix.service == 'career'
        working-directory: services/${{ matrix.service }}-service
        run: python -c "import tiktoken; tiktoken.get_encoding('o200k_harmony')"
      - name: Validate contracts and MongoDB repositories
        working-directory: services/${{ matrix.service }}-service
        run: python -m pytest
        env:
          MONGODB_TEST_URI: mongodb://localhost:27017

  local-ui-integration:
    name: Local UI and MongoDB integration
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      AI_ENABLED: 'false'
      APP_ENV: development
      AUTH_MODE: local_test
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: '587'
      SMTP_SECURITY: starttls
      GOOGLE_CLIENT_ID: ''
      GATEWAY_PORT: '8081'
      MONGO_ROOT_PASSWORD: ci-only-root-password
      PROFILE_DB_PASSWORD: ci-only-profile-password
      CAREER_DB_PASSWORD: ci-only-career-password
      CV_DB_PASSWORD: ci-only-cv-password
      ASSESSMENT_DB_PASSWORD: ci-only-assessment-password
      ROADMAP_DB_PASSWORD: ci-only-roadmap-password
      JOBS_DB_PASSWORD: ci-only-jobs-password
      SOCIALS_DB_PASSWORD: ci-only-socials-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/frontend
      - name: Start the Gmail-backed test stack
        env:
          SMTP_USERNAME: ${{ secrets.ELO_TEST_GMAIL_ADDRESS }}
          SMTP_FROM: ${{ secrets.ELO_TEST_GMAIL_ADDRESS }}
          SMTP_PASSWORD: ${{ secrets.ELO_TEST_GMAIL_APP_PASSWORD }}
        run: |
          if [[ -z "$SMTP_USERNAME" || -z "$SMTP_PASSWORD" ]]; then
            echo "::error::Set ELO_TEST_GMAIL_ADDRESS and ELO_TEST_GMAIL_APP_PASSWORD in GitHub Actions secrets."
            exit 1
          fi
          docker compose --env-file /dev/null -p ci-profile -f infrastructure/docker/compose.yaml -f infrastructure/docker/compose.test.yaml up --build -d
      - name: Wait for the gateway and API
        run: curl --fail --silent --show-error --retry 20 --retry-delay 2 --retry-all-errors http://localhost:8081/api/v1/profile/auth-config
      - run: npx playwright test --config playwright.integration.config.ts
        working-directory: apps/frontend
        env:
          PROFILE_E2E_BASE_URL: http://localhost:8081
          ELO_TEST_GMAIL_ADDRESS: ${{ secrets.ELO_TEST_GMAIL_ADDRESS }}
          ELO_TEST_GMAIL_APP_PASSWORD: ${{ secrets.ELO_TEST_GMAIL_APP_PASSWORD }}
      - name: Service logs on failure
        if: ${{ failure() }}
        run: docker compose --env-file /dev/null -p ci-profile -f infrastructure/docker/compose.yaml -f infrastructure/docker/compose.test.yaml logs --tail=100
      - name: Remove disposable test services
        if: ${{ always() }}
        run: docker compose --env-file /dev/null -p ci-profile -f infrastructure/docker/compose.yaml -f infrastructure/docker/compose.test.yaml down -v

  test-gate:
    name: Test gate
    if: ${{ always() }}
    needs: [database-artifacts, lint, frontend-unit, frontend-e2e, backend, static-analysis, unused-code, profile-integration, analysis-integration, local-ui-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test job to pass
        env:
          ARTIFACT_RESULT: ${{ needs.database-artifacts.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          UNIT_RESULT: ${{ needs.frontend-unit.result }}
          E2E_RESULT: ${{ needs.frontend-e2e.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          STATIC_RESULT: ${{ needs.static-analysis.result }}
          UNUSED_RESULT: ${{ needs.unused-code.result }}
          LOCAL_UI_RESULT: ${{ needs.local-ui-integration.result }}
          GMAIL_SECRETS_UNAVAILABLE: ${{ github.actor == 'dependabot[bot]' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
          ANALYSIS_RESULT: ${{ needs.analysis-integration.result }}
          INTEGRATION_RESULT: ${{ needs.profile-integration.result }}
        run: |
          test "$ARTIFACT_RESULT" = success
          test "$LINT_RESULT" = success
          test "$UNIT_RESULT" = success
          test "$E2E_RESULT" = success
          test "$BACKEND_RESULT" = success
          test "$STATIC_RESULT" = success
          test "$UNUSED_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          if [[ "$LOCAL_UI_RESULT" != success ]]; then
            test "$GMAIL_SECRETS_UNAVAILABLE" = true
            test "$LOCAL_UI_RESULT" = skipped
          fi
          test "$ANALYSIS_RESULT" = success
