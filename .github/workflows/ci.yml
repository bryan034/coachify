name: Coachify CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-unit:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace apps/frontend
      - run: npm run test --workspace apps/frontend

  frontend-e2e:
    name: Frontend browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/frontend
      - run: npm run test:e2e --workspace apps/frontend
        env:
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: test-client.apps.googleusercontent.com
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            apps/frontend/playwright-report/
            apps/frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  backend:
    name: Backend tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [profile, cv, career, roadmap, dashboard, review]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Run pytest (allow empty suites)
        shell: bash
        run: |
          status=0
          python -m pytest || status=$?
          if [ "$status" -eq 5 ]; then
            echo "No pytest tests collected; passing this service."
            exit 0
          fi
          exit "$status"

  profile-integration:
    name: Profile MongoDB integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
        working-directory: services/profile-service
      - run: python -m pytest
        working-directory: services/profile-service
        env:
          MONGODB_TEST_URI: mongodb://localhost:27017

  analysis-integration:
    name: Analysis MongoDB contracts (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [career, cv]
    services:
      mongodb:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate contracts and MongoDB repositories
        working-directory: services/${{ matrix.service }}-service
        run: |
          python -m pip install -e '.[test]'
          python -m pytest
        env:
          MONGODB_TEST_URI: mongodb://localhost:27017

  local-ui-integration:
    name: Local UI and MongoDB integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_ENABLED: 'false'
      APP_ENV: development
      AUTH_MODE: local_test
      COMPOSE_PROFILES: development
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_SECURITY: plain
      SMTP_FROM: no-reply@coachify.test
      MAILPIT_PORT: '8026'
      GOOGLE_CLIENT_ID: ''
      GATEWAY_PORT: '8081'
      MONGO_ROOT_PASSWORD: ci-only-root-password
      PROFILE_DB_PASSWORD: ci-only-profile-password
      CAREER_DB_PASSWORD: ci-only-career-password
      CV_DB_PASSWORD: ci-only-cv-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/frontend
      - run: docker compose -p ci-profile -f infrastructure/docker/compose.yaml up --build -d
      - name: Wait for the gateway and API
        run: curl --fail --silent --show-error --retry 20 --retry-delay 2 --retry-all-errors http://localhost:8081/api/v1/profile/auth-config
      - run: npx playwright test --config playwright.integration.config.ts
        working-directory: apps/frontend
        env:
          PROFILE_E2E_BASE_URL: http://localhost:8081
          MAILPIT_BASE_URL: http://localhost:8026
      - name: Upload local integration test artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: local-ui-integration-results
          path: apps/frontend/test-results/integration/
          retention-days: 7
          if-no-files-found: ignore
      - name: Service logs on failure
        if: ${{ failure() }}
        run: docker compose -p ci-profile -f infrastructure/docker/compose.yaml logs --tail=100
      - name: Remove disposable test services
        if: ${{ always() }}
        run: docker compose -p ci-profile -f infrastructure/docker/compose.yaml down -v

  test-gate:
    name: Test gate
    if: ${{ always() }}
    needs: [frontend-unit, frontend-e2e, backend, profile-integration, analysis-integration, local-ui-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test job to pass
        env:
          UNIT_RESULT: ${{ needs.frontend-unit.result }}
          E2E_RESULT: ${{ needs.frontend-e2e.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          LOCAL_UI_RESULT: ${{ needs.local-ui-integration.result }}
          ANALYSIS_RESULT: ${{ needs.analysis-integration.result }}
          INTEGRATION_RESULT: ${{ needs.profile-integration.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$E2E_RESULT" = success
          test "$BACKEND_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$LOCAL_UI_RESULT" = success
          test "$ANALYSIS_RESULT" = success
