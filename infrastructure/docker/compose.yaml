name: coachify-profile
services:
  gateway:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:${GATEWAY_PORT:-8080}:80"]
    volumes: ["../gateway/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [frontend, profile-service, career-service, cv-service]
    networks: [web, backend]
  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    networks: [web]
  profile-service:
    build: ../../services/profile-service
    environment:
      APP_ENV: ${APP_ENV:-production}
      AUTH_MODE: ${AUTH_MODE:-email}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MONGODB_URI: mongodb://coachify_profile:${PROFILE_DB_PASSWORD:?Set PROFILE_DB_PASSWORD}@mongodb:27017/coachify_profile
      MONGODB_DATABASE: coachify_profile
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [backend, database]
  career-service:
    build: ../../services/career-service
    environment:
      PROFILE_SERVICE_URL: http://profile-service:8000
      CV_SERVICE_URL: http://cv-service:8000
      MONGODB_URI: mongodb://coachify_career:${CAREER_DB_PASSWORD:?Set CAREER_DB_PASSWORD}@mongodb:27017/coachify_career
      MONGODB_DATABASE: coachify_career
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-45}
      AI_RETRIES: ${AI_RETRIES:-1}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-4096}
      AI_CONTEXT_TOKENS: ${AI_CONTEXT_TOKENS:-65536}
      GEMINI_REASONING_MODEL: ${GEMINI_REASONING_MODEL:-gemini-3.5-flash-lite}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DISCOVERY_TARGET_LISTINGS: ${DISCOVERY_TARGET_LISTINGS:-10}
      DISCOVERY_MAX_LISTINGS: ${DISCOVERY_MAX_LISTINGS:-20}
      DISCOVERY_TARGET_EMPLOYERS: ${DISCOVERY_TARGET_EMPLOYERS:-5}
      DISCOVERY_MAX_FOLLOWUPS: ${DISCOVERY_MAX_FOLLOWUPS:-2}
      DISCOVERY_FRESHNESS_HOURS: ${DISCOVERY_FRESHNESS_HOURS:-168}
      OPPORTUNITY_ENABLED: ${OPPORTUNITY_ENABLED:-true}
      OPPORTUNITY_MAX_SEARCHES: ${OPPORTUNITY_MAX_SEARCHES:-2}
      OPPORTUNITY_MAX_FOLLOWUPS: ${OPPORTUNITY_MAX_FOLLOWUPS:-1}
      OPPORTUNITY_CONCURRENCY: ${OPPORTUNITY_CONCURRENCY:-3}
      OPPORTUNITY_TIMEOUT_SECONDS: ${OPPORTUNITY_TIMEOUT_SECONDS:-30}
      OPPORTUNITY_RETRIES: ${OPPORTUNITY_RETRIES:-1}
      OPPORTUNITY_SCHEMA_REPAIRS: ${OPPORTUNITY_SCHEMA_REPAIRS:-1}
      OPPORTUNITY_EVIDENCE_TOKENS: ${OPPORTUNITY_EVIDENCE_TOKENS:-8192}
      OPPORTUNITY_FRESHNESS_HOURS: ${OPPORTUNITY_FRESHNESS_HOURS:-168}
      OPPORTUNITY_INCOMPLETE_HOURS: ${OPPORTUNITY_INCOMPLETE_HOURS:-1}
      OPPORTUNITY_RUN_SECONDS: ${OPPORTUNITY_RUN_SECONDS:-300}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      BRAVE_SEARCH_MODE: llm_context
      TMPDIR: /tmp
    depends_on:
      profile-service:
        condition: service_started
      mongodb-career-init:
        condition: service_completed_successfully
    networks: [backend, database]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=0700,uid=10001,gid=10001
    mem_limit: 768m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  cv-service:
    build: ../../services/cv-service
    environment:
      PROFILE_SERVICE_URL: http://profile-service:8000
      MONGODB_URI: mongodb://coachify_cv:${CV_DB_PASSWORD:?Set CV_DB_PASSWORD}@mongodb:27017/coachify_ingestion
      MONGODB_DATABASE: coachify_ingestion
    depends_on:
      profile-service:
        condition: service_started
      mongodb-career-init:
        condition: service_completed_successfully
    networks: [backend, database]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  mongodb-career-init:
    image: mongo:8.0
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
      CAREER_DB_PASSWORD: ${CAREER_DB_PASSWORD:?Set CAREER_DB_PASSWORD}
      CV_DB_PASSWORD: ${CV_DB_PASSWORD:?Set CV_DB_PASSWORD}
    volumes:
      - ../mongodb/init-career.js:/setup/init-career.js:ro
    command: ["mongosh", "--nodb", "--quiet", "/setup/init-career.js"]
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [database]
    restart: "no"
  mailpit:
    image: axllent/mailpit:v1.32.0
    profiles: [development]
    ports: ["127.0.0.1:${MAILPIT_PORT:-8025}:8025"]
    networks: [backend]
  mongodb:
    image: mongo:8.0
    environment:
      # Docker Desktop kernels 6.19+ need the rseq compatibility setting.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
      MONGO_INITDB_ROOT_USERNAME: coachify_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
      PROFILE_DB_PASSWORD: ${PROFILE_DB_PASSWORD:?Set PROFILE_DB_PASSWORD}
    volumes:
      - profile_data:/data/db
      - ../mongodb/init-profile.js:/docker-entrypoint-initdb.d/init-profile.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [database]
networks:
  web: {}
  backend: {}
  database:
    internal: true
volumes:
  profile_data: {}
