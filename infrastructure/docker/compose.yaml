name: coachify-profile
services:
  gateway:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:${GATEWAY_PORT:-8080}:80"]
    volumes: ["../gateway/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [frontend, profile-service, career-service, cv-service]
    networks: [web, backend]
  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    networks: [web]
  profile-service:
    build: ../../services/profile-service
    environment:
      APP_ENV: ${APP_ENV:-production}
      AUTH_MODE: ${AUTH_MODE:-email}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MONGODB_URI: mongodb://coachify_profile:${PROFILE_DB_PASSWORD:?Set PROFILE_DB_PASSWORD}@mongodb:27017/coachify_profile
      MONGODB_DATABASE: coachify_profile
      CV_SERVICE_URL: http://cv-service:8000
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [backend, database]
  cv-service:
    build: ../../services/cv-service
    environment:
      APP_ENV: ${APP_ENV:-production}
      PROFILE_SERVICE_URL: http://profile-service:8000
      CAREER_SERVICE_URL: http://career-service:8000
      MONGODB_URI: mongodb://coachify_cv:${CV_DB_PASSWORD:?Set CV_DB_PASSWORD}@mongodb:27017/coachify_ingestion
      MONGODB_DATABASE: coachify_ingestion
      CV_STORAGE_PATH: /app/uploads
      CV_MAX_FILE_BYTES: '10485760'
      CV_LLM_BASE_URL: ${CV_LLM_BASE_URL:-https://api.groq.com/openai/v1}
      CV_LLM_MODEL: ${CV_LLM_MODEL:-}
      CV_LLM_API_KEY: ${CV_LLM_API_KEY:-}
    depends_on:
      profile-service:
        condition: service_started
      mongodb:
        condition: service_healthy
    networks: [backend, database]
    read_only: true
    volumes: [cv_uploads:/app/uploads]
    tmpfs:
      - /tmp:size=64m,mode=0700,uid=10001,gid=10001
    mem_limit: 768m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  career-service:
    build: ../../services/career-service
    environment:
      PROFILE_SERVICE_URL: http://profile-service:8000
      MONGODB_URI: mongodb://coachify_career:${CAREER_DB_PASSWORD:?Set CAREER_DB_PASSWORD}@mongodb:27017/coachify_career
      MONGODB_DATABASE: coachify_career
      TMPDIR: /tmp
    depends_on:
      profile-service:
        condition: service_started
      mongodb:
        condition: service_healthy
    networks: [backend, database]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=0700,uid=10001,gid=10001
    mem_limit: 768m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  mailpit:
    image: axllent/mailpit:v1.32.0
    profiles: [development]
    ports: ["127.0.0.1:${MAILPIT_PORT:-8025}:8025"]
    networks: [backend]
  mongodb:
    image: mongo:8.0
    environment:
      # Docker Desktop kernels 6.19+ need the rseq compatibility setting.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
      MONGO_INITDB_ROOT_USERNAME: coachify_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
      PROFILE_DB_PASSWORD: ${PROFILE_DB_PASSWORD:?Set PROFILE_DB_PASSWORD}
      CV_DB_PASSWORD: ${CV_DB_PASSWORD:?Set CV_DB_PASSWORD}
      CAREER_DB_PASSWORD: ${CAREER_DB_PASSWORD:?Set CAREER_DB_PASSWORD}
    volumes:
      - profile_data:/data/db
      - ../mongodb/init-profile.js:/docker-entrypoint-initdb.d/init-profile.js:ro
      - ../mongodb/init-cv.js:/docker-entrypoint-initdb.d/init-cv.js:ro
      - ../mongodb/init-career.js:/docker-entrypoint-initdb.d/init-career.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [database]
networks:
  web: {}
  backend: {}
  database:
    internal: true
volumes:
  profile_data: {}
  cv_uploads: {}
