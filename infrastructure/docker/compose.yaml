name: elo-profile
x-model-budget: &model-budget
  MODEL_BUDGET_OWNER_CALLS_PER_DAY: ${MODEL_BUDGET_OWNER_CALLS_PER_DAY:-250}

services:
  gateway:
    image: nginx:1.30.8-alpine
    ports: ["127.0.0.1:${GATEWAY_PORT:-8080}:80"]
    volumes: ["../gateway/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [frontend, profile-service, career-service, cv-service, assessment-service, roadmap-service, dashboard-service, jobs-service, socials-service]
    networks: [web, backend]
  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    networks: [web]
  profile-service:
    build:
      context: ../..
      dockerfile: services/profile-service/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      AUTH_MODE: ${AUTH_MODE:-email}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MONGODB_URI: mongodb://elo_profile:${PROFILE_DB_PASSWORD:?Set PROFILE_DB_PASSWORD}@mongodb:27017/elo_profile
      MONGODB_DATABASE: elo_profile
      CV_SERVICE_URL: http://cv-service:8000
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [backend, database]
  career-service:
    init: true
    build:
      context: ../..
      dockerfile: services/career-service/Dockerfile
    environment:
      <<: *model-budget
      PROFILE_SERVICE_URL: http://profile-service:8000
      CV_SERVICE_URL: http://cv-service:8000
      MONGODB_URI: mongodb://elo_career:${CAREER_DB_PASSWORD:?Set CAREER_DB_PASSWORD}@mongodb:27017/elo_career
      MONGODB_DATABASE: elo_career
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      AI_RETRIES: ${AI_RETRIES:-1}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-}
      AI_CONTEXT_TOKENS: ${AI_CONTEXT_TOKENS:-}
      CAREER_LLM_BASE_URL: ${CAREER_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      CAREER_LLM_RESPONSE_MODE: ${CAREER_LLM_RESPONSE_MODE:-}
      CAREER_LLM_TOKEN_PARAMETER: ${CAREER_LLM_TOKEN_PARAMETER:-max_tokens}
      CAREER_LLM_MODEL: ${CAREER_LLM_MODEL:-openai/gpt-4o-mini}
      CAREER_LLM_API_KEY: ${CAREER_LLM_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DISCOVERY_TARGET_LISTINGS: ${DISCOVERY_TARGET_LISTINGS:-10}
      DISCOVERY_MAX_LISTINGS: ${DISCOVERY_MAX_LISTINGS:-20}
      DISCOVERY_TARGET_EMPLOYERS: ${DISCOVERY_TARGET_EMPLOYERS:-5}
      DISCOVERY_MAX_FOLLOWUPS: ${DISCOVERY_MAX_FOLLOWUPS:-2}
      DISCOVERY_FRESHNESS_HOURS: ${DISCOVERY_FRESHNESS_HOURS:-168}
      OPPORTUNITY_ENABLED: ${OPPORTUNITY_ENABLED:-true}
      OPPORTUNITY_TOPIC_SEARCHES: ${OPPORTUNITY_TOPIC_SEARCHES:-2}
      OPPORTUNITY_RUN_SEARCHES: ${OPPORTUNITY_RUN_SEARCHES:-25}
      OPPORTUNITY_CONCURRENCY: ${OPPORTUNITY_CONCURRENCY:-3}
      OPPORTUNITY_TIMEOUT_SECONDS: ${OPPORTUNITY_TIMEOUT_SECONDS:-40}
      OPPORTUNITY_RETRIES: ${OPPORTUNITY_RETRIES:-2}
      OPPORTUNITY_SCHEMA_REPAIRS: ${OPPORTUNITY_SCHEMA_REPAIRS:-1}
      OPPORTUNITY_EVIDENCE_TOKENS: ${OPPORTUNITY_EVIDENCE_TOKENS:-}
      OPPORTUNITY_FRESHNESS_HOURS: ${OPPORTUNITY_FRESHNESS_HOURS:-168}
      OPPORTUNITY_INCOMPLETE_HOURS: ${OPPORTUNITY_INCOMPLETE_HOURS:-1}
      OPPORTUNITY_RUN_SECONDS: ${OPPORTUNITY_RUN_SECONDS:-600}
      CAREER_RESEARCH_API_KEY: ${CAREER_RESEARCH_API_KEY:-}
      CAREER_RESEARCH_PROVIDER: ${CAREER_RESEARCH_PROVIDER:-openrouter}
      # Unset means brave; an explicitly blank value disables the fallback.
      CAREER_RESEARCH_FALLBACK_PROVIDER: ${CAREER_RESEARCH_FALLBACK_PROVIDER-brave}
      CAREER_RESEARCH_MODEL: ${CAREER_RESEARCH_MODEL:-openai/gpt-4.1-mini}
      CAREER_RESEARCH_MAX_TOOL_CALLS: ${CAREER_RESEARCH_MAX_TOOL_CALLS:-3}
      CAREER_RESEARCH_TIMEOUT_SECONDS: ${CAREER_RESEARCH_TIMEOUT_SECONDS:-15}
      CAREER_RESEARCH_SEARCHES_PER_ACCOUNT_PER_DAY: ${CAREER_RESEARCH_SEARCHES_PER_ACCOUNT_PER_DAY:-}
      CAREER_RESEARCH_MAX_URLS_PER_SEARCH: ${CAREER_RESEARCH_MAX_URLS_PER_SEARCH:-}
      TMPDIR: /tmp
    depends_on:
      profile-service:
        condition: service_started
      mongodb-career-init:
        condition: service_completed_successfully
    networks: [backend, database]
    read_only: true
    volumes: [model_budget:/var/lib/elo-model-budget]
    tmpfs:
      - /tmp:size=128m,mode=0700,uid=10001,gid=10001
    mem_limit: 768m
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true, "seccomp=./career-browser-seccomp.json"]
  cv-service:
    build:
      context: ../..
      dockerfile: services/cv-service/Dockerfile
    environment:
      <<: *model-budget
      APP_ENV: ${APP_ENV:-production}
      PROFILE_SERVICE_URL: http://profile-service:8000
      CAREER_SERVICE_URL: http://career-service:8000
      MONGODB_URI: mongodb://elo_cv:${CV_DB_PASSWORD:?Set CV_DB_PASSWORD}@mongodb:27017/elo_ingestion
      MONGODB_DATABASE: elo_ingestion
      CV_STORAGE_PATH: /app/uploads
      CV_MAX_FILE_BYTES: ${CV_MAX_FILE_BYTES:-10485760}
      CV_MAX_SAVED_CVS_PER_OWNER: ${CV_MAX_SAVED_CVS_PER_OWNER:-3}
      CV_MAX_ORIGINAL_BYTES_PER_OWNER: ${CV_MAX_ORIGINAL_BYTES_PER_OWNER:-104857600}
      CV_MODEL_CALLS_PER_OWNER_PER_DAY: ${CV_MODEL_CALLS_PER_OWNER_PER_DAY:-120}
      CV_MODEL_CONCURRENT_PER_OWNER: ${CV_MODEL_CONCURRENT_PER_OWNER:-1}
      CV_INTERVIEW_MAX_TARGET_ATTEMPTS: ${CV_INTERVIEW_MAX_TARGET_ATTEMPTS:-2}
      CV_LLM_BASE_URL: ${CV_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      CV_LLM_MODEL: ${CV_LLM_MODEL:-openai/gpt-4o-mini}
      CV_LLM_RESPONSE_MODE: ${CV_LLM_RESPONSE_MODE:-json_schema}
      CV_LLM_API_KEY: ${CV_LLM_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CV_LLM_ALLOW_HTTP: ${CV_LLM_ALLOW_HTTP:-false}
    depends_on:
      profile-service:
        condition: service_started
      mongodb-career-init:
        condition: service_completed_successfully
    networks: [backend, database]
    read_only: true
    volumes: [cv_uploads:/app/uploads, model_budget:/var/lib/elo-model-budget]
    tmpfs:
      - /tmp:size=64m,mode=0700,uid=10001,gid=10001
    mem_limit: 768m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  mongodb-career-init:
    image: mongo:8.2
    environment:
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
      CAREER_DB_PASSWORD: ${CAREER_DB_PASSWORD:?Set CAREER_DB_PASSWORD}
      CV_DB_PASSWORD: ${CV_DB_PASSWORD:?Set CV_DB_PASSWORD}
    volumes:
      - ../mongodb/init-career.js:/setup/init-career.js:ro
    command: ["mongosh", "--nodb", "--quiet", "/setup/init-career.js"]
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [database]
    restart: "no"
  assessment-service:
    build:
      context: ../..
      dockerfile: services/assessment-service/Dockerfile
    environment:
      <<: *model-budget
      APP_ENV: ${APP_ENV:-production}
      PROFILE_SERVICE_URL: http://profile-service:8000
      CV_SERVICE_URL: http://cv-service:8000
      CAREER_SERVICE_URL: http://career-service:8000
      ASSESSMENT_SERVICE_URL: http://assessment-service:8000
      MONGODB_URI: mongodb://elo_assessment:${ASSESSMENT_DB_PASSWORD:?Set ASSESSMENT_DB_PASSWORD}@mongodb:27017/elo_assessment
      MONGODB_DATABASE: elo_assessment
      ASSESSMENT_LLM_API_KEY: ${ASSESSMENT_LLM_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ASSESSMENT_LLM_MODEL: ${ASSESSMENT_LLM_MODEL:-openai/gpt-4o-mini}
      ASSESSMENT_LLM_BASE_URL: ${ASSESSMENT_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      ASSESSMENT_LLM_TOKEN_PARAMETER: ${ASSESSMENT_LLM_TOKEN_PARAMETER:-max_tokens}
      ASSESSMENT_LLM_ALLOW_HTTP: ${ASSESSMENT_LLM_ALLOW_HTTP:-false}
    depends_on:
      mongodb-planning-init:
        condition: service_completed_successfully
    networks: [backend, database]
    read_only: true
    volumes: [model_budget:/var/lib/elo-model-budget]
    tmpfs: ["/tmp:size=32m,mode=0700,uid=10001,gid=10001"]
    mem_limit: 512m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  roadmap-service:
    build:
      context: ../..
      dockerfile: services/roadmap-service/Dockerfile
    environment:
      <<: *model-budget
      APP_ENV: ${APP_ENV:-production}
      PROFILE_SERVICE_URL: http://profile-service:8000
      CV_SERVICE_URL: http://cv-service:8000
      CAREER_SERVICE_URL: http://career-service:8000
      ASSESSMENT_SERVICE_URL: http://assessment-service:8000
      MONGODB_URI: mongodb://elo_roadmap:${ROADMAP_DB_PASSWORD:?Set ROADMAP_DB_PASSWORD}@mongodb:27017/elo_roadmap
      MONGODB_DATABASE: elo_roadmap
      ROADMAP_LLM_API_KEY: ${ROADMAP_LLM_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ROADMAP_LLM_MODEL: ${ROADMAP_LLM_MODEL:-openai/gpt-4o-mini}
      ROADMAP_LLM_BASE_URL: ${ROADMAP_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      ROADMAP_LLM_TOKEN_PARAMETER: ${ROADMAP_LLM_TOKEN_PARAMETER:-max_tokens}
      ROADMAP_LLM_ALLOW_HTTP: ${ROADMAP_LLM_ALLOW_HTTP:-false}
    depends_on:
      mongodb-planning-init:
        condition: service_completed_successfully
    networks: [backend, database]
    read_only: true
    volumes: [model_budget:/var/lib/elo-model-budget]
    tmpfs: ["/tmp:size=32m,mode=0700,uid=10001,gid=10001"]
    mem_limit: 512m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  dashboard-service:
    build:
      context: ../..
      dockerfile: services/dashboard-service/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      PROFILE_SERVICE_URL: http://profile-service:8000
      ROADMAP_SERVICE_URL: http://roadmap-service:8000
      ASSESSMENT_SERVICE_URL: http://assessment-service:8000
    depends_on: [profile-service, roadmap-service, assessment-service]
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=0700,uid=10001,gid=10001"]
    mem_limit: 512m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  jobs-service:
    build:
      context: ../..
      dockerfile: services/jobs-service/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      PROFILE_SERVICE_URL: http://profile-service:8000
      MONGODB_URI: mongodb://elo_jobs:${JOBS_DB_PASSWORD:?Set JOBS_DB_PASSWORD}@mongodb:27017/elo_jobs
      MONGODB_DATABASE: elo_jobs
    depends_on:
      mongodb-jobs-init:
        condition: service_completed_successfully
    networks: [backend, database]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=0700,uid=10001,gid=10001"]
    mem_limit: 512m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  mongodb-jobs-init:
    image: mongo:8.2
    environment:
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
      JOBS_DB_PASSWORD: ${JOBS_DB_PASSWORD:?Set JOBS_DB_PASSWORD}
    volumes: ["../mongodb/init-jobs.js:/setup/init-jobs.js:ro"]
    command: ["mongosh", "--nodb", "--quiet", "/setup/init-jobs.js"]
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [database]
    restart: "no"
  socials-service:
    build:
      context: ../..
      dockerfile: services/socials-service/Dockerfile
    environment:
      PROFILE_SERVICE_URL: http://profile-service:8000
      CAREER_SERVICE_URL: http://career-service:8000
      MONGODB_URI: mongodb://elo_socials:${SOCIALS_DB_PASSWORD:?Set SOCIALS_DB_PASSWORD}@mongodb:27017/elo_socials
      MONGODB_DATABASE: elo_socials
      SOCIALS_OPERATOR_ACCOUNT_IDS: ${SOCIALS_OPERATOR_ACCOUNT_IDS:-}
    depends_on:
      mongodb-socials-init:
        condition: service_completed_successfully
    networks: [backend, database]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=0700,uid=10001,gid=10001"]
    mem_limit: 512m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  mongodb-socials-init:
    image: mongo:8.2
    environment:
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
      SOCIALS_DB_PASSWORD: ${SOCIALS_DB_PASSWORD:?Set SOCIALS_DB_PASSWORD}
    volumes: ["../mongodb/init-socials.js:/setup/init-socials.js:ro"]
    command: ["mongosh", "--nodb", "--quiet", "/setup/init-socials.js"]
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [database]
    restart: "no"
  mongodb-planning-init:
    image: mongo:8.2
    environment:
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
      ASSESSMENT_DB_PASSWORD: ${ASSESSMENT_DB_PASSWORD:?Set ASSESSMENT_DB_PASSWORD}
      ROADMAP_DB_PASSWORD: ${ROADMAP_DB_PASSWORD:?Set ROADMAP_DB_PASSWORD}
    volumes: ["../mongodb/init-planning.js:/setup/init-planning.js:ro"]
    command: ["mongosh", "--nodb", "--quiet", "/setup/init-planning.js"]
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [database]
    restart: "no"
  mongodb:
    # See docs/setup.md for volume upgrades and host kernel compatibility.
    image: mongo:8.2
    environment:
      MONGO_INITDB_ROOT_USERNAME: elo_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
      PROFILE_DB_PASSWORD: ${PROFILE_DB_PASSWORD:?Set PROFILE_DB_PASSWORD}
    volumes:
      - profile_data:/data/db
      - ../mongodb/init-profile.js:/docker-entrypoint-initdb.d/init-profile.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--host", "mongodb", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [database]
networks:
  web: {}
  backend: {}
  database:
    internal: true
volumes:
  profile_data: {}
  cv_uploads: {}
  model_budget: {}
