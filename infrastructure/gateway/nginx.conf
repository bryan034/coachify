events {}
http {
    limit_req_zone $binary_remote_addr zone=account_access:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=career_import:10m rate=6r/m;
    limit_req_zone $binary_remote_addr zone=cv_upload:10m rate=6r/m;
    server {
        listen 80;
        client_max_body_size 64k;
        location = /api/v1/profile {
            proxy_pass http://profile-service:8000;
            proxy_set_header Host $host;
        }
        location = /api/v1/profile/auth/complete {
            limit_req zone=account_access burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://profile-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/v1/profile/ {
            proxy_pass http://profile-service:8000;
            proxy_set_header Host $host;
        }
        location = /api/v1/career/imports/document {
            client_max_body_size 11m;
            proxy_request_buffering off;
            proxy_buffering off;
            access_log off;
            limit_req zone=career_import burst=3 nodelay;
            limit_req_status 429;
            proxy_read_timeout 30s;
            proxy_pass http://career-service:8000;
            proxy_set_header Host $host;
        }
        location = /api/v1/career/imports/url {
            client_max_body_size 16k;
            proxy_request_buffering off;
            proxy_buffering off;
            access_log off;
            limit_req zone=career_import burst=3 nodelay;
            limit_req_status 429;
            proxy_read_timeout 35s;
            proxy_pass http://career-service:8000;
            proxy_set_header Host $host;
        }
        location = /api/v1/career/explorations/cv/document {
            client_max_body_size 11m;
            proxy_request_buffering off;
            proxy_buffering off;
            access_log off;
            limit_req zone=career_import burst=3 nodelay;
            limit_req_status 429;
            proxy_read_timeout 30s;
            proxy_pass http://career-service:8000;
            proxy_set_header Host $host;
        }
        location ~ "^/api/v1/career/goals/[0-9a-f]{24}/interview-research$" {
            client_max_body_size 16k;
            access_log off;
            proxy_buffering off;
            proxy_read_timeout 100s;
            proxy_pass http://career-service:8000;
            proxy_set_header Host $host;
        }
        location /api/v1/career/workspace {
            client_max_body_size 256k;
            access_log off;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 70s;
            proxy_pass http://career-service:8000;
            proxy_set_header Host $host;
        }
        location /api/v1/career/jd/ {
            client_max_body_size 256k;
            access_log off;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 70s;
            proxy_pass http://career-service:8000;
            proxy_set_header Host $host;
        }
        location ~ "^/api/v1/career/goals/[0-9a-f]{24}/review$" {
            client_max_body_size 256k;
            access_log off;
            proxy_buffering off;
            proxy_read_timeout 70s;
            proxy_pass http://career-service:8000;
            proxy_set_header Host $host;
        }
        location = /api/v1/career/targets {
            client_max_body_size 256k;
            proxy_request_buffering off;
            proxy_buffering off;
            access_log off;
            proxy_pass http://career-service:8000;
            proxy_set_header Host $host;
        }
        location /api/v1/career/targets/ {
            client_max_body_size 256k;
            proxy_request_buffering off;
            proxy_buffering off;
            access_log off;
            proxy_pass http://career-service:8000;
            proxy_set_header Host $host;
        }
        location /api/v1/career/ {
            client_max_body_size 96k;
            access_log off;
            proxy_buffering off;
            proxy_read_timeout 70s;
            proxy_pass http://career-service:8000;
            proxy_set_header Host $host;
        }
        location = /api/v1/cv/uploads {
            client_max_body_size 11m;
            proxy_request_buffering off;
            proxy_buffering off;
            access_log off;
            limit_req zone=cv_upload burst=3 nodelay;
            limit_req_status 429;
            proxy_read_timeout 60s;
            proxy_pass http://cv-service:8000;
            proxy_set_header Host $host;
        }
        location = /api/v1/cv {
            access_log off;
            proxy_pass http://cv-service:8000;
            proxy_set_header Host $host;
        }
        location /api/v1/cv/ {
            access_log off;
            proxy_pass http://cv-service:8000;
            proxy_set_header Host $host;
        }
        location /api/ { return 404; }
        location /internal/ { return 404; }
        # Next.js development HMR; production Next.js does not expose this socket.
        location ~ ^/_next/(webpack-hmr|hmr)(/|$) {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
