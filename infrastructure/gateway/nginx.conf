pid /tmp/nginx.pid;
events {}
http {
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Privacy-redacted access log: records path ($uri) without query parameters ($args), headers or tokens.
    log_format redacted '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent rt=$request_time';
    access_log /dev/stdout redacted;

    # When deployed behind a trusted TLS reverse proxy or load balancer, uncomment set_real_ip_from
    # for the proxy CIDR so rate limits and X-Real-IP use the end-user address rather than the proxy IP.
    # set_real_ip_from 10.0.0.0/8;
    # set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_zone $binary_remote_addr zone=account_access:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=account_recovery:10m rate=6r/m;
    limit_req_zone $binary_remote_addr zone=profile_directory:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=career_import:10m rate=6r/m;
    limit_req_zone $binary_remote_addr zone=cv_upload:10m rate=6r/m;
    limit_req_zone $binary_remote_addr zone=ai_operations:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=jobs_search:10m rate=5r/s;

    server {
        listen 8080;
        client_max_body_size 64k;

        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        location = /api/v1/profile {
            proxy_pass http://profile-service:8000;
            proxy_set_header Host $host;
        }
        location ~ ^/api/v1/profile/auth/(attempts(/cancel)?|complete|verify-email|resend-verification)/?$ {
            limit_req zone=account_access burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://profile-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
        location ~ ^/api/v1/profile/auth/(forgot-password|reset-password)/?$ {
            limit_req zone=account_recovery burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://profile-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
        location ~ ^/api/v1/profile/(institutions|companies|industries|school-categories|school-countries)/?$ {
            limit_req zone=profile_directory burst=30 nodelay;
            limit_req_status 429;
            proxy_pass http://profile-service:8000;
            proxy_set_header Host $host;
        }
        location /api/v1/profile/ {
            proxy_pass http://profile-service:8000;
            proxy_set_header Host $host;
        }
        location = /api/v1/career/imports/document {
            client_max_body_size 11m;
            proxy_request_buffering off;
            proxy_buffering off;
            limit_req zone=career_import burst=3 nodelay;
            limit_req_status 429;
            proxy_read_timeout 30s;
            proxy_pass http://career-service:8000;
            proxy_set_header Host $host;
        }
        location = /api/v1/career/imports/url {
            client_max_body_size 16k;
            proxy_request_buffering off;
            proxy_buffering off;
            limit_req zone=career_import burst=3 nodelay;
            limit_req_status 429;
            proxy_read_timeout 35s;
            proxy_pass http://career-service:8000;
            proxy_set_header Host $host;
        }
        location = /api/v1/career/explorations/cv/document {
            client_max_body_size 11m;
            proxy_request_buffering off;
            proxy_buffering off;
            limit_req zone=career_import burst=3 nodelay;
            limit_req_status 429;
            proxy_read_timeout 30s;
            proxy_pass http://career-service:8000;
            proxy_set_header Host $host;
        }
        location ~ "^/api/v1/career/goals/[0-9a-f]{24}/interview-research$" {
            client_max_body_size 16k;
            limit_req zone=ai_operations burst=30 nodelay;
            limit_req_status 429;
            proxy_buffering off;
            proxy_read_timeout 610s;
            proxy_pass http://career-service:8000;
            proxy_set_header Host $host;
        }
        location /api/v1/career/workspace {
            client_max_body_size 256k;
            limit_req zone=ai_operations burst=30 nodelay;
            limit_req_status 429;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 610s;
            proxy_pass http://career-service:8000;
            proxy_set_header Host $host;
        }
        location /api/v1/career/jd/ {
            client_max_body_size 256k;
            limit_req zone=ai_operations burst=30 nodelay;
            limit_req_status 429;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 610s;
            proxy_pass http://career-service:8000;
            proxy_set_header Host $host;
        }
        location ~ "^/api/v1/career/goals/[0-9a-f]{24}/review$" {
            client_max_body_size 256k;
            limit_req zone=ai_operations burst=30 nodelay;
            limit_req_status 429;
            proxy_buffering off;
            proxy_read_timeout 610s;
            proxy_pass http://career-service:8000;
            proxy_set_header Host $host;
        }
        location = /api/v1/career/targets {
            client_max_body_size 256k;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_pass http://career-service:8000;
            proxy_set_header Host $host;
        }
        location /api/v1/career/targets/ {
            client_max_body_size 256k;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_pass http://career-service:8000;
            proxy_set_header Host $host;
        }
        location /api/v1/career/ {
            client_max_body_size 96k;
            limit_req zone=ai_operations burst=30 nodelay;
            limit_req_status 429;
            proxy_buffering off;
            proxy_read_timeout 610s;
            proxy_pass http://career-service:8000;
            proxy_set_header Host $host;
        }
        location = /api/v1/cv/uploads {
            client_max_body_size 11m;
            proxy_request_buffering off;
            proxy_buffering off;
            limit_req zone=cv_upload burst=3 nodelay;
            limit_req_status 429;
            proxy_read_timeout 60s;
            proxy_pass http://cv-service:8000;
            proxy_set_header Host $host;
        }
        location = /api/v1/cv {
            proxy_pass http://cv-service:8000;
            proxy_set_header Host $host;
        }
        location /api/v1/cv/ {
            proxy_pass http://cv-service:8000;
            proxy_set_header Host $host;
        }
        # One skill is re-judged within the request (a model call with one repair), so it gets a longer read timeout.
        location = /api/v1/assessments/skills/reevaluate {
            limit_req zone=ai_operations burst=20 nodelay;
            limit_req_status 429;
            proxy_buffering off;
            proxy_read_timeout 90s;
            proxy_pass http://assessment-service:8000;
            proxy_set_header Host $host;
        }
        # Assessment context/current include derived evaluation freshness; commands remain asynchronous.
        location /api/v1/assessments {
            limit_req zone=ai_operations burst=30 nodelay;
            limit_req_status 429;
            proxy_buffering off;
            proxy_read_timeout 30s;
            proxy_pass http://assessment-service:8000;
            proxy_set_header Host $host;
        }
        # Includes planner sessions, backlog proposals and milestone checkpoint writes.
        # Weekly outline/task preview routes share the existing 64k request limit.
        # Legacy generation and month routes return 404 from the service.
        location /api/v1/roadmaps {
            limit_req zone=ai_operations burst=30 nodelay;
            limit_req_status 429;
            proxy_buffering off;
            proxy_read_timeout 30s;
            proxy_pass http://roadmap-service:8000;
            proxy_set_header Host $host;
        }
        location = /api/v1/dashboard {
            proxy_buffering off;
            proxy_read_timeout 60s;
            proxy_pass http://dashboard-service:8000;
            proxy_set_header Host $host;
        }
        location /api/v1/dashboard/ {
            proxy_buffering off;
            proxy_read_timeout 60s;
            proxy_pass http://dashboard-service:8000;
            proxy_set_header Host $host;
        }
        location /api/v1/jobs {
            limit_req zone=jobs_search burst=20 nodelay;
            limit_req_status 429;
            proxy_buffering off;
            proxy_read_timeout 60s;
            proxy_pass http://jobs-service:8000;
            proxy_set_header Host $host;
        }
        location /api/ { return 404; }
        location /internal/ { return 404; }
        include /etc/nginx/extra.d/*.conf;
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
