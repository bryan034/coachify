events {}
http {
    limit_req_zone $binary_remote_addr zone=account_access:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=career_import:10m rate=6r/m;
    limit_req_zone $binary_remote_addr zone=cv_upload:10m rate=6r/m;
    server {
        listen 80;
        client_max_body_size 64k;
        location = /api/v1/profile {
            proxy_pass http://profile-service:8000;
            proxy_set_header Host $host;
        }
        location = /api/v1/profile/auth/complete {
            limit_req zone=account_access burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://profile-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/v1/profile/ {
            proxy_pass http://profile-service:8000;
            proxy_set_header Host $host;
        }
        location = /api/v1/career/imports/document {
            client_max_body_size 11m;
            proxy_request_buffering off;
            proxy_buffering off;
            access_log off;
            limit_req zone=career_import burst=3 nodelay;
            limit_req_status 429;
            proxy_read_timeout 30s;
            proxy_pass http://career-service:8000;
            proxy_set_header Host $host;
        }
        location = /api/v1/career/imports/url {
            client_max_body_size 16k;
            proxy_request_buffering off;
            proxy_buffering off;
            access_log off;
            limit_req zone=career_import burst=3 nodelay;
            limit_req_status 429;
            proxy_read_timeout 30s;
            proxy_pass http://career-service:8000;
            proxy_set_header Host $host;
        }
        location = /api/v1/cv/uploads {
            client_max_body_size 11m;
            proxy_request_buffering off;
            proxy_buffering off;
            access_log off;
            limit_req zone=cv_upload burst=3 nodelay;
            limit_req_status 429;
            proxy_read_timeout 60s;
            proxy_pass http://cv-service:8000;
            proxy_set_header Host $host;
        }
        location = /api/v1/cv {
            proxy_pass http://cv-service:8000;
            proxy_set_header Host $host;
            access_log off;
        }
        location /api/v1/cv/ {
            proxy_pass http://cv-service:8000;
            proxy_set_header Host $host;
            access_log off;
        }
        location = /api/v1/career/targets {
            client_max_body_size 256k;
            proxy_request_buffering off;
            proxy_buffering off;
            access_log off;
            proxy_pass http://career-service:8000;
            proxy_set_header Host $host;
        }
        location /api/v1/career/targets/ {
            client_max_body_size 256k;
            proxy_request_buffering off;
            proxy_buffering off;
            access_log off;
            proxy_pass http://career-service:8000;
            proxy_set_header Host $host;
        }
        location /api/v1/career/ { return 404; }
        location /api/ { return 404; }
        location /internal/ { return 404; }
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
