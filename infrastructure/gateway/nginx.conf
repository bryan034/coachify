events {}
http {
    limit_req_zone $binary_remote_addr zone=account_access:10m rate=5r/s;
    server {
        listen 80;
        client_max_body_size 64k;
        location = /api/v1/profile {
            proxy_pass http://profile-service:8000;
            proxy_set_header Host $host;
        }
        location = /api/v1/profile/auth/complete {
            limit_req zone=account_access burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://profile-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/v1/profile/ {
            proxy_pass http://profile-service:8000;
            proxy_set_header Host $host;
        }
        location /api/ { return 404; }
        location /internal/ { return 404; }
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
