  "components": {
    "schemas": {
      "Generation": {
        "properties": {
          "provider": {
            "type": "string",
            "maxLength": 160,
            "minLength": 1,
            "title": "Provider"
          },
          "model": {
            "type": "string",
            "maxLength": 160,
            "minLength": 1,
            "title": "Model"
          },
          "prompt_version": {
            "type": "string",
            "maxLength": 160,
            "minLength": 1,
            "title": "Prompt Version"
          },
          "schema_version": {
            "type": "string",
            "const": "analysis-v1",
            "title": "Schema Version",
            "default": "analysis-v1"
          },
          "generated_at": {
            "type": "string",
            "format": "date-time",
            "title": "Generated At"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "provider",
          "model",
          "prompt_version",
          "generated_at"
        ],
        "title": "Generation"
      },
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array",
            "title": "Detail"
          }
        },
        "type": "object",
        "title": "HTTPValidationError"
      },
      "ImportErrorView": {
        "properties": {
          "detail": {
            "type": "string",
            "title": "Detail"
          }
        },
        "type": "object",
        "required": [
          "detail"
        ],
        "title": "ImportErrorView"
      },
      "JDExtraction": {
        "properties": {
          "role": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 160,
                "minLength": 1
              },
              {
                "type": "null"
              }
            ],
            "title": "Role"
          },
          "field": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 160,
                "minLength": 1
              },
              {
                "type": "null"
              }
            ],
            "title": "Field"
          },
          "company": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 160,
                "minLength": 1
              },
              {
                "type": "null"
              }
            ],
            "title": "Company"
          },
          "skills": {
            "items": {
              "$ref": "#/components/schemas/ReviewSkill"
            },
            "type": "array",
            "maxItems": 60,
            "title": "Skills"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "role",
          "field",
          "company",
          "skills"
        ],
        "title": "JDExtraction"
      },
      "JDExtractionResult": {
        "properties": {
          "extraction": {
            "$ref": "#/components/schemas/JDExtraction"
          },
          "generation": {
            "$ref": "#/components/schemas/Generation"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "extraction",
          "generation"
        ],
        "title": "JDExtractionResult"
      },
      "JDMessage": {
        "properties": {
          "text": {
            "type": "string",
            "maxLength": 20000,
            "minLength": 1,
            "title": "Text"
          },
          "source_url": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Source Url"
          },
          "message": {
            "type": "string",
            "maxLength": 600,
            "minLength": 1,
            "title": "Message"
          },
          "skills": {
            "items": {
              "$ref": "#/components/schemas/ReviewSkill"
            },
            "type": "array",
            "maxItems": 60,
            "title": "Skills"
          },
          "conversation": {
            "items": {
              "$ref": "#/components/schemas/ReviewMessage"
            },
            "type": "array",
            "maxItems": 12,
            "title": "Conversation"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "text",
          "message",
          "skills"
        ],
        "title": "JDMessage"
      },
      "JDReply": {
        "properties": {
          "reply": {
            "type": "string",
            "maxLength": 600,
            "minLength": 1,
            "title": "Reply"
          },
          "proposed_skills": {
            "anyOf": [
              {
                "items": {
                  "$ref": "#/components/schemas/ReviewSkill"
                },
                "type": "array"
              },
              {
                "type": "null"
              }
            ],
            "title": "Proposed Skills"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "reply",
          "proposed_skills"
        ],
        "title": "JDReply"
      },
      "JDSource": {
        "properties": {
          "text": {
            "type": "string",
            "maxLength": 20000,
            "minLength": 1,
            "title": "Text"
          },
          "source_url": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Source Url"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "text"
        ],
        "title": "JDSource"
      },
      "Preview": {
        "properties": {
          "kind": {
            "type": "string",
            "enum": [
              "url",
              "document"
            ],
            "title": "Kind"
          },
          "text": {
            "type": "string",
            "maxLength": 20000,
            "minLength": 1,
            "title": "Text"
          },
          "source_name": {
            "type": "string",
            "title": "Source Name"
          },
          "source_url": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Source Url"
          },
          "notices": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "title": "Notices"
          }
        },
        "type": "object",
        "required": [
          "kind",
          "text",
          "source_name"
        ],
        "title": "Preview"
      },
      "ReviewMessage": {
        "properties": {
          "role": {
            "type": "string",
            "enum": [
              "user",
              "assistant"
            ],
            "title": "Role"
          },
          "content": {
            "type": "string",
            "maxLength": 600,
            "minLength": 1,
            "title": "Content"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "role",
          "content"
        ],
        "title": "ReviewMessage"
      },
      "ReviewSkill": {
        "properties": {
          "name": {
            "type": "string",
            "maxLength": 160,
            "minLength": 1,
            "title": "Name"
          },
          "category": {
            "type": "string",
            "maxLength": 160,
            "minLength": 1,
            "title": "Category"
          },
          "priority": {
            "type": "string",
            "enum": [
              "required",
              "preferred",
              "suggested"
            ],
            "title": "Priority"
          },
          "required_proficiency": {
            "anyOf": [
              {
                "type": "string",
                "enum": [
                  "beginner",
                  "intermediate",
                  "advanced",
                  "expert"
                ]
              },
              {
                "type": "null"
              }
            ],
            "title": "Required Proficiency"
          },
          "required_experience_months": {
            "anyOf": [
              {
                "type": "integer",
                "maximum": 1200.0,
                "minimum": 0.0
              },
              {
                "type": "null"
              }
            ],
            "title": "Required Experience Months"
          },
          "context": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 600,
                "minLength": 1
              },
              {
                "type": "null"
              }
            ],
            "title": "Context"
          },
          "evidence": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 600,
                "minLength": 1
              },
              {
                "type": "null"
              }
            ],
            "title": "Evidence"
          },
          "origin": {
            "type": "string",
            "enum": [
              "employer",
              "generated_guidance",
              "user_declaration"
            ],
            "title": "Origin"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "name",
          "category",
          "priority",
          "origin"
        ],
        "title": "ReviewSkill"
      },
      "SaveGoal": {
        "properties": {
          "expected_selection_version": {
            "type": "integer",
            "minimum": 0.0,
            "title": "Expected Selection Version"
          },
          "expected_draft_version": {
            "anyOf": [
              {
                "type": "integer",
                "minimum": 1.0
              },
              {
                "type": "null"
              }
            ],
