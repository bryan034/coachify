  "components": {
    "schemas": {
      "Generation": {
        "properties": {
          "provider": {
            "type": "string",
            "maxLength": 160,
            "minLength": 1,
            "title": "Provider"
          },
          "model": {
            "type": "string",
            "maxLength": 160,
            "minLength": 1,
            "title": "Model"
          },
          "prompt_version": {
            "type": "string",
            "maxLength": 160,
            "minLength": 1,
            "title": "Prompt Version"
          },
          "schema_version": {
            "type": "string",
            "const": "analysis-v1",
            "title": "Schema Version",
            "default": "analysis-v1"
          },
          "generated_at": {
            "type": "string",
            "format": "date-time",
            "title": "Generated At"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "provider",
          "model",
          "prompt_version",
          "generated_at"
        ],
        "title": "Generation"
      },
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array",
            "title": "Detail"
          }
        },
        "type": "object",
        "title": "HTTPValidationError"
      },
      "ImportErrorView": {
        "properties": {
          "detail": {
            "type": "string",
            "title": "Detail"
          }
        },
        "type": "object",
        "required": [
          "detail"
        ],
        "title": "ImportErrorView"
      },
      "JDExtraction": {
        "properties": {
          "role": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 160,
                "minLength": 1
              },
              {
                "type": "null"
              }
            ],
            "title": "Role"
          },
          "field": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 160,
                "minLength": 1
              },
              {
                "type": "null"
              }
            ],
            "title": "Field"
          },
          "company": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 160,
                "minLength": 1
              },
              {
                "type": "null"
              }
            ],
            "title": "Company"
          },
          "location": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 160,
                "minLength": 1
              },
              {
                "type": "null"
              }
            ],
            "title": "Location"
          },
          "seniority_level": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 160,
                "minLength": 1
              },
              {
                "type": "null"
              }
            ],
            "title": "Seniority Level"
          },
          "job_url": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Job Url"
          },
          "summary": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 600,
                "minLength": 1
              },
              {
                "type": "null"
              }
            ],
            "title": "Summary"
          },
          "responsibilities": {
            "items": {
              "type": "string",
              "maxLength": 600,
              "minLength": 1
            },
            "type": "array",
            "maxItems": 20,
            "title": "Responsibilities"
          },
          "non_skill_requirements": {
            "items": {
              "$ref": "#/components/schemas/NonSkillRequirement"
            },
            "type": "array",
            "maxItems": 30,
            "title": "Non Skill Requirements"
          },
          "skills": {
            "items": {
              "$ref": "#/components/schemas/ReviewSkill"
            },
            "type": "array",
            "maxItems": 60,
            "title": "Skills"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "role",
          "field",
          "company",
          "skills"
        ],
        "title": "JDExtraction"
      },
      "JDExtractionResult": {
        "properties": {
          "review_id": {
            "type": "string",
            "pattern": "^[0-9a-f]{24}$",
            "title": "Review Id"
          },
          "version": {
            "type": "integer",
            "minimum": 1.0,
            "title": "Version"
          },
          "target_type": {
            "type": "string",
            "enum": [
              "specific_job",
              "career_exploration"
            ],
            "title": "Target Type"
          },
          "extraction": {
            "$ref": "#/components/schemas/JDExtraction"
          },
          "baseline": {
            "$ref": "#/components/schemas/JDExtraction"
          },
          "metadata_origins": {
            "additionalProperties": {
              "type": "string",
              "enum": [
                "extracted",
                "user"
              ]
            },
            "type": "object",
            "title": "Metadata Origins"
          },
          "requirements_need_review": {
            "type": "boolean",
            "title": "Requirements Need Review"
          },
          "is_confirmed": {
            "type": "boolean",
            "title": "Is Confirmed"
          },
          "generation": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/Generation"
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "review_id",
          "version",
          "target_type",
          "extraction",
          "baseline",
          "metadata_origins",
          "requirements_need_review",
          "is_confirmed",
          "generation"
        ],
        "title": "JDExtractionResult"
      },
      "JDMessage": {
        "properties": {
          "review_id": {
            "type": "string",
            "title": "Review Id"
          },
          "expected_version": {
            "type": "integer",
            "minimum": 1.0,
            "title": "Expected Version"
          },
          "message": {
            "type": "string",
            "maxLength": 600,
            "minLength": 1,
            "title": "Message"
          },
          "conversation": {
            "items": {
              "$ref": "#/components/schemas/ReviewMessage"
            },
            "type": "array",
            "maxItems": 12,
            "title": "Conversation"
          }
        },
        "additionalProperties": false,
        "type": "object",
