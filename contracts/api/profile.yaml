openapi: 3.1.0
info:
  title: Coachify profile API
  description: Verified email/password accounts, optional Google, and revocable owner-scoped
    sessions.
  version: 0.1.0
paths:
  /api/v1/profile/auth-config:
    get:
      summary: Auth Config
      operationId: auth_config_api_v1_profile_auth_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfigView'
  /api/v1/profile/school-categories:
    get:
      summary: School Categories
      operationId: school_categories_api_v1_profile_school_categories_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CategoryView'
                type: array
                title: Response School Categories Api V1 Profile School Categories
                  Get
  /api/v1/profile/school-countries:
    get:
      summary: School Countries
      operationId: school_countries_api_v1_profile_school_countries_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CountryView'
                type: array
                title: Response School Countries Api V1 Profile School Countries Get
  /api/v1/profile/institutions:
    get:
      summary: Institutions
      operationId: institutions_api_v1_profile_institutions_get
      parameters:
      - name: category
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/SchoolCategory'
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 150
          default: ''
          title: Q
      - name: country
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[A-Z]{2}$
          - type: 'null'
          title: Country
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionResults'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/profile/companies:
    get:
      summary: Companies
      operationId: companies_api_v1_profile_companies_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 150
          default: ''
          title: Q
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmploymentOption'
                title: Response Companies Api V1 Profile Companies Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/profile/industries:
    get:
      summary: Industries
      operationId: industries_api_v1_profile_industries_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 150
          default: ''
          title: Q
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmploymentOption'
                title: Response Industries Api V1 Profile Industries Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/profile:
    get:
      summary: Get Profile
      operationId: get_profile_api_v1_profile_get
      security:
      - HTTPBearer: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileView'
    patch:
      summary: Patch Profile
      operationId: patch_profile_api_v1_profile_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9_-]+$
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/profile/onboarding/complete:
    post:
      tags:
      - P13–P14 initial setup
      summary: Finish Onboarding
      operationId: finish_onboarding_api_v1_profile_onboarding_complete_post
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9_-]+$
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/profile/availability-periods:
    post:
      summary: Add Period
      operationId: add_period_api_v1_profile_availability_periods_post
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9_-]+$
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/profile/availability-periods/{period_id}:
    patch:
      summary: Edit Period
      operationId: edit_period_api_v1_profile_availability_periods__period_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: period_id
        in: path
        required: true
        schema:
          type: string
          title: Period Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9_-]+$
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodEdit'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      summary: Delete Period
      operationId: delete_period_api_v1_profile_availability_periods__period_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: period_id
        in: path
        required: true
        schema:
          type: string
          title: Period Id
      - name: expected_version
        in: query
        required: true
        schema:
          type: integer
          minimum: 0
          title: Expected Version
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9_-]+$
          - type: 'null'
          title: Idempotency-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/profile/planning-inputs:
    get:
      summary: Get Planning Inputs
      operationId: get_planning_inputs_api_v1_profile_planning_inputs_get
      security:
      - HTTPBearer: []
      parameters:
      - name: time_zone
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
          title: Time Zone
      - name: start_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Start Date
      - name: end_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: End Date
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningInputs'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/profile/versions/{version}:
    get:
      summary: Get Version
      operationId: get_version_api_v1_profile_versions__version__get
      security:
      - HTTPBearer: []
      parameters:
      - name: version
        in: path
        required: true
        schema:
          type: integer
          title: Version
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/profile/auth/local-accounts:
    get:
      tags:
      - P09–P16 account access
      summary: Local Accounts
      operationId: local_accounts_api_v1_profile_auth_local_accounts_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Choice'
                type: array
                title: Response Local Accounts Api V1 Profile Auth Local Accounts
                  Get
  /api/v1/profile/auth/attempts:
    post:
      tags:
      - P09–P16 account access
      summary: Begin
      operationId: begin_api_v1_profile_auth_attempts_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Begin'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Nonce'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/profile/auth/attempts/cancel:
    post:
      tags:
      - P09–P16 account access
      summary: Cancel
      operationId: cancel_api_v1_profile_auth_attempts_cancel_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Attempt'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Done'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/profile/auth/complete:
    post:
      tags:
      - P09–P16 account access
      summary: Complete
      operationId: complete_api_v1_profile_auth_complete_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Complete'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AccountView'
                - $ref: '#/components/schemas/PendingVerification'
                title: Response Complete Api V1 Profile Auth Complete Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/profile/auth/verify-email:
    post:
      tags:
      - P09–P16 account access
      summary: Verify
      operationId: verify_api_v1_profile_auth_verify_email_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verify'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/profile/auth/resend-verification:
    post:
      tags:
      - P09–P16 account access
      summary: Resend
      operationId: resend_api_v1_profile_auth_resend_verification_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationAccess'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingVerification'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/profile/auth/session:
    get:
      tags:
      - P09–P16 account access
      summary: Session
      operationId: session_api_v1_profile_auth_session_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountView'
      security:
      - HTTPBearer: []
  /api/v1/profile/auth/logout:
    post:
      tags:
      - P09–P16 account access
      summary: Logout
      operationId: logout_api_v1_profile_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Done'
      security:
      - HTTPBearer: []
components:
  schemas:
    AccountView:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        email:
          type: string
          title: Email
        email_verified:
          type: boolean
          title: Email Verified
        provider:
          type: string
          enum:
          - google
          - local_test
          - email
          title: Provider
        expires_at:
          type: string
          format: date-time
          title: Expires At
      type: object
      required:
      - id
      - name
      - email
      - email_verified
      - provider
      - expires_at
      title: AccountView
    Attempt:
      properties:
        flow_id:
          type: string
          maxLength: 128
          minLength: 32
          pattern: ^[A-Za-z0-9_-]+$
          title: Flow Id
        attempt_id:
          type: string
          maxLength: 128
          minLength: 32
          pattern: ^[A-Za-z0-9_-]+$
          title: Attempt Id
      additionalProperties: false
      type: object
      required:
      - flow_id
      - attempt_id
      title: Attempt
    AuthConfigView:
      properties:
        mode:
          type: string
          enum:
          - google
          - email
          - local_test
          title: Mode
        email_password_enabled:
          type: boolean
          title: Email Password Enabled
        google_enabled:
          type: boolean
          title: Google Enabled
        email_verification_required:
          type: boolean
          title: Email Verification Required
          default: true
        development_tools_enabled:
          type: boolean
          title: Development Tools Enabled
          default: false
      type: object
      required:
      - mode
      - email_password_enabled
      - google_enabled
      title: AuthConfigView
    AvailabilityPeriod:
      properties:
        id:
          type: string
          title: Id
        start_date:
          type: string
          title: Start Date
        end_date:
          type: string
          title: End Date
        weekly_hours:
          type: number
          maximum: 168.0
          minimum: 0.0
          title: Weekly Hours
      type: object
      required:
      - id
      - start_date
      - end_date
      - weekly_hours
      title: AvailabilityPeriod
    Begin:
      properties:
        flow_id:
          type: string
          maxLength: 128
          minLength: 32
          pattern: ^[A-Za-z0-9_-]+$
          title: Flow Id
        attempt_id:
          type: string
          maxLength: 128
          minLength: 32
          pattern: ^[A-Za-z0-9_-]+$
          title: Attempt Id
        intent:
          type: string
          enum:
          - login
          - register
          title: Intent
        generation:
          type: integer
          maximum: 9007199254740991.0
          minimum: 1.0
          title: Generation
      additionalProperties: false
      type: object
      required:
      - flow_id
      - attempt_id
      - intent
      - generation
      title: Begin
    CapacityWindow:
      properties:
        start_date:
          type: string
          title: Start Date
        end_date:
          type: string
          title: End Date
        available_hours:
          anyOf:
          - type: number
          - type: 'null'
          title: Available Hours
      type: object
      required:
      - start_date
      - end_date
      - available_hours
      title: CapacityWindow
    CatalogueInstitution:
      properties:
        kind:
          type: string
          const: catalogue
          title: Kind
        id:
          type: string
          maxLength: 80
          minLength: 1
          title: Id
      additionalProperties: false
      type: object
      required:
      - kind
      - id
      title: CatalogueInstitution
    CategoryView:
      properties:
        id:
          $ref: '#/components/schemas/SchoolCategory'
        label:
          type: string
          title: Label
      type: object
      required:
      - id
      - label
      title: CategoryView
    Choice:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        email:
          type: string
          title: Email
      type: object
      required:
      - id
      - name
      - email
      title: Choice
    Complete:
      properties:
        flow_id:
          type: string
          maxLength: 128
          minLength: 32
          pattern: ^[A-Za-z0-9_-]+$
          title: Flow Id
        attempt_id:
          type: string
          maxLength: 128
          minLength: 32
          pattern: ^[A-Za-z0-9_-]+$
          title: Attempt Id
        session_token:
          type: string
          maxLength: 128
          minLength: 32
          pattern: ^[A-Za-z0-9_-]+$
          title: Session Token
        name:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Name
        email:
          anyOf:
          - type: string
            maxLength: 254
          - type: 'null'
          title: Email
        password:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 12
          - type: 'null'
          title: Password
        credential:
          anyOf:
          - type: string
            maxLength: 12000
          - type: 'null'
          title: Credential
      additionalProperties: false
      type: object
      required:
      - flow_id
      - attempt_id
      - session_token
      title: Complete
    CountryView:
      properties:
        code:
          type: string
          title: Code
        name:
          type: string
          title: Name
      type: object
      required:
      - code
      - name
      title: CountryView
    CustomInstitution:
      properties:
        kind:
          type: string
          const: custom
          title: Kind
        name:
          type: string
          maxLength: 300
          title: Name
        country_code:
          anyOf:
          - type: string
            pattern: ^[A-Z]{2}$
          - type: 'null'
          title: Country Code
      additionalProperties: false
      type: object
      required:
      - kind
      - name
      title: CustomInstitution
    Done:
      properties:
        ok:
          type: boolean
          title: Ok
      type: object
      required:
      - ok
      title: Done
    EducationPatch:
      properties:
        institution:
          anyOf:
          - oneOf:
            - $ref: '#/components/schemas/CatalogueInstitution'
            - $ref: '#/components/schemas/CustomInstitution'
            discriminator:
              propertyName: kind
              mapping:
                catalogue: '#/components/schemas/CatalogueInstitution'
                custom: '#/components/schemas/CustomInstitution'
          - type: 'null'
          title: Institution
        course:
          anyOf:
          - type: string
            maxLength: 300
          - type: 'null'
          title: Course
        study_year:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Study Year
        graduation_year:
          anyOf:
          - type: integer
            maximum: 9999.0
            minimum: 1900.0
          - type: 'null'
          title: Graduation Year
      additionalProperties: false
      type: object
      title: EducationPatch
    EducationView:
      properties:
        institution:
          anyOf:
          - $ref: '#/components/schemas/SavedInstitution'
          - type: 'null'
        course:
          anyOf:
          - type: string
          - type: 'null'
          title: Course
        study_year:
          anyOf:
          - type: integer
          - type: 'null'
          title: Study Year
        graduation_year:
          anyOf:
          - type: integer
          - type: 'null'
          title: Graduation Year
        study_year_label:
          anyOf:
          - type: string
          - type: 'null'
          title: Study Year Label
        study_year_category:
          anyOf:
          - $ref: '#/components/schemas/SchoolCategory'
          - type: 'null'
        category:
          anyOf:
          - $ref: '#/components/schemas/SchoolCategory'
          - type: 'null'
        context:
          anyOf:
          - type: string
            enum:
            - current
            - last
          - type: 'null'
          title: Context
      additionalProperties: true
      type: object
      title: EducationView
    EmploymentOption:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
      type: object
      required:
      - id
      - name
      title: EmploymentOption
    EmploymentPatch:
      properties:
        employer:
          anyOf:
          - type: string
            maxLength: 300
          - type: 'null'
          title: Employer
        role:
          anyOf:
          - type: string
            maxLength: 300
          - type: 'null'
          title: Role
        industry:
          anyOf:
          - type: string
            maxLength: 300
          - type: 'null'
          title: Industry
      additionalProperties: false
      type: object
      title: EmploymentPatch
    EmploymentView:
      properties:
        employer:
          anyOf:
          - type: string
          - type: 'null'
          title: Employer
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
        industry:
          anyOf:
          - type: string
          - type: 'null'
          title: Industry
      type: object
      title: EmploymentView
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
