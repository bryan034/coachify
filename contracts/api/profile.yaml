# Generated from profile-service app.openapi(); keep in sync with the implemented routes.
openapi: 3.1.0
info:
  title: Coachify profile API
  description: Google bearer authentication by default. Explicit local_test mode uses
    a fixed server identity only in development; see docs/development/profile-setup.md.
  version: 0.1.0
paths:
  /api/v1/profile/auth-config:
    get:
      summary: Auth Config
      operationId: auth_config_api_v1_profile_auth_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfigView'
  /api/v1/profile/school-categories:
    get:
      summary: School Categories
      operationId: school_categories_api_v1_profile_school_categories_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CategoryView'
                type: array
                title: Response School Categories Api V1 Profile School Categories
                  Get
  /api/v1/profile/school-countries:
    get:
      summary: School Countries
      operationId: school_countries_api_v1_profile_school_countries_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CountryView'
                type: array
                title: Response School Countries Api V1 Profile School Countries Get
  /api/v1/profile/institutions:
    get:
      summary: Institutions
      operationId: institutions_api_v1_profile_institutions_get
      parameters:
      - name: category
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/SchoolCategory'
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 150
          default: ''
          title: Q
      - name: country
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[A-Z]{2}$
          - type: 'null'
          title: Country
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionResults'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/profile:
    get:
      summary: Get Profile
      operationId: get_profile_api_v1_profile_get
      security:
      - HTTPBearer: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileView'
    patch:
      summary: Patch Profile
      operationId: patch_profile_api_v1_profile_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9_-]+$
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/profile/availability-periods:
    post:
      summary: Add Period
      operationId: add_period_api_v1_profile_availability_periods_post
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9_-]+$
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/profile/availability-periods/{period_id}:
    patch:
      summary: Edit Period
      operationId: edit_period_api_v1_profile_availability_periods__period_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: period_id
        in: path
        required: true
        schema:
          type: string
          title: Period Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9_-]+$
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodEdit'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      summary: Delete Period
      operationId: delete_period_api_v1_profile_availability_periods__period_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: period_id
        in: path
        required: true
        schema:
          type: string
          title: Period Id
      - name: expected_version
        in: query
        required: true
        schema:
          type: integer
          minimum: 0
          title: Expected Version
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9_-]+$
          - type: 'null'
          title: Idempotency-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/profile/planning-inputs:
    get:
      summary: Get Planning Inputs
      operationId: get_planning_inputs_api_v1_profile_planning_inputs_get
      security:
      - HTTPBearer: []
      parameters:
      - name: time_zone
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
          title: Time Zone
      - name: start_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Start Date
      - name: end_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: End Date
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningInputs'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/profile/versions/{version}:
    get:
      summary: Get Version
      operationId: get_version_api_v1_profile_versions__version__get
      security:
      - HTTPBearer: []
      parameters:
      - name: version
        in: path
        required: true
        schema:
          type: integer
          title: Version
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AuthConfigView:
      properties:
        mode:
          type: string
          enum:
          - google
          - local_test
          title: Mode
      type: object
      required:
      - mode
      title: AuthConfigView
    AvailabilityPeriod:
      properties:
        id:
          type: string
          title: Id
        start_date:
          type: string
          title: Start Date
        end_date:
          type: string
          title: End Date
        weekly_hours:
          type: number
          maximum: 168.0
          minimum: 0.0
          title: Weekly Hours
      type: object
      required:
      - id
      - start_date
      - end_date
      - weekly_hours
      title: AvailabilityPeriod
    CapacityWindow:
      properties:
        start_date:
          type: string
          title: Start Date
        end_date:
          type: string
          title: End Date
        available_hours:
          anyOf:
          - type: number
          - type: 'null'
          title: Available Hours
      type: object
      required:
      - start_date
      - end_date
      - available_hours
      title: CapacityWindow
    CatalogueInstitution:
      properties:
        kind:
          type: string
          const: catalogue
          title: Kind
        id:
          type: string
          maxLength: 80
          minLength: 1
          title: Id
      additionalProperties: false
      type: object
      required:
      - kind
      - id
      title: CatalogueInstitution
    CategoryView:
      properties:
        id:
          $ref: '#/components/schemas/SchoolCategory'
        label:
          type: string
          title: Label
      type: object
      required:
      - id
      - label
      title: CategoryView
    CountryView:
      properties:
        code:
          type: string
          title: Code
        name:
          type: string
          title: Name
      type: object
      required:
      - code
      - name
      title: CountryView
    CustomInstitution:
      properties:
        kind:
          type: string
          const: custom
          title: Kind
        name:
          type: string
          maxLength: 300
          title: Name
        country_code:
          anyOf:
          - type: string
            pattern: ^[A-Z]{2}$
          - type: 'null'
          title: Country Code
      additionalProperties: false
      type: object
      required:
      - kind
      - name
      title: CustomInstitution
    EducationPatch:
      properties:
        institution:
          anyOf:
          - oneOf:
            - $ref: '#/components/schemas/CatalogueInstitution'
            - $ref: '#/components/schemas/CustomInstitution'
            discriminator:
              propertyName: kind
              mapping:
                catalogue: '#/components/schemas/CatalogueInstitution'
                custom: '#/components/schemas/CustomInstitution'
          - type: 'null'
          title: Institution
        course:
          anyOf:
          - type: string
            maxLength: 300
          - type: 'null'
          title: Course
        study_year:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Study Year
      additionalProperties: false
      type: object
      title: EducationPatch
    EducationView:
      properties:
        institution:
          anyOf:
          - $ref: '#/components/schemas/SavedInstitution'
          - type: 'null'
        course:
          anyOf:
          - type: string
          - type: 'null'
          title: Course
        study_year:
          anyOf:
          - type: integer
          - type: 'null'
          title: Study Year
        study_year_label:
          anyOf:
          - type: string
          - type: 'null'
          title: Study Year Label
        study_year_category:
          anyOf:
          - $ref: '#/components/schemas/SchoolCategory'
          - type: 'null'
        category:
          anyOf:
          - $ref: '#/components/schemas/SchoolCategory'
          - type: 'null'
        context:
          anyOf:
          - type: string
            enum:
            - current
            - last
          - type: 'null'
          title: Context
      additionalProperties: true
      type: object
      title: EducationView
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    InstitutionResults:
      properties:
        items:
          items:
            $ref: '#/components/schemas/InstitutionView'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        offset:
          type: integer
          title: Offset
        limit:
          type: integer
          title: Limit
        snapshot_date:
          type: string
          title: Snapshot Date
        coverage_note:
          type: string
          title: Coverage Note
      type: object
      required:
      - items
      - total
      - offset
      - limit
      - snapshot_date
      - coverage_note
      title: InstitutionResults
    InstitutionView:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        categories:
          items:
            $ref: '#/components/schemas/SchoolCategory'
          type: array
          title: Categories
        country_code:
          type: string
          title: Country Code
        country:
          type: string
          title: Country
        domains:
          items:
            type: string
          type: array
          title: Domains
        source:
          type: string
          title: Source
      type: object
      required:
      - id
      - name
      - categories
      - country_code
      - country
      - domains
      - source
      title: InstitutionView
    OccupationalStatus:
      type: string
      enum:
      - student
      - national_service
      - unemployed
      - employed
      title: OccupationalStatus
    PeriodCreate:
      properties:
        expected_version:
          type: integer
          minimum: 0.0
          title: Expected Version
        start_date:
          type: string
          title: Start Date
        end_date:
          type: string
          title: End Date
        weekly_hours:
          type: number
          maximum: 168.0
          minimum: 0.0
          title: Weekly Hours
      additionalProperties: false
      type: object
      required:
      - expected_version
      - start_date
      - end_date
      - weekly_hours
      title: PeriodCreate
    PeriodEdit:
      properties:
        expected_version:
          type: integer
          minimum: 0.0
          title: Expected Version
        start_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Start Date
        end_date:
          anyOf:
          - type: string
          - type: 'null'
          title: End Date
        weekly_hours:
          anyOf:
          - type: number
            maximum: 168.0
            minimum: 0.0
          - type: 'null'
          title: Weekly Hours
      additionalProperties: false
      type: object
      required:
      - expected_version
      title: PeriodEdit
    PlanningInputs:
      properties:
        profile_version:
          type: integer
          title: Profile Version
        planning_revision:
          type: integer
          title: Planning Revision
        application_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Application Date
        application_time_zone:
          anyOf:
          - type: string
          - type: 'null'
          title: Application Time Zone
        validation_time_zone:
          type: string
          title: Validation Time Zone
        validation_date:
          type: string
          title: Validation Date
        capacity_as_of_date:
          type: string
          title: Capacity As Of Date
        weekly_hours:
          anyOf:
          - type: number
          - type: 'null'
          title: Weekly Hours
        hours_unit:
          type: string
          title: Hours Unit
          default: hours_per_week
        availability_periods:
          items:
            $ref: '#/components/schemas/AvailabilityPeriod'
          type: array
          title: Availability Periods
        capacity_time_zone:
          type: string
          title: Capacity Time Zone
          default: Asia/Singapore
        week_start:
          type: string
          title: Week Start
          default: Monday
        week_end:
          type: string
          title: Week End
          default: Sunday
        period_boundaries:
          type: string
          title: Period Boundaries
          default: inclusive
        proration:
          type: string
          title: Proration
          default: weekly_hours / 7 per covered calendar date; period rate replaces
            base rate
        ready:
          type: boolean
          title: Ready
        issues:
          items:
            $ref: '#/components/schemas/PlanningIssue'
          type: array
          title: Issues
        capacity_window:
          anyOf:
          - $ref: '#/components/schemas/CapacityWindow'
          - type: 'null'
      type: object
      required:
      - profile_version
      - planning_revision
      - application_date
      - application_time_zone
      - validation_time_zone
      - validation_date
      - capacity_as_of_date
      - weekly_hours
      - availability_periods
      - ready
      - issues
      title: PlanningInputs
    PlanningIssue:
      properties:
        field:
          type: string
          title: Field
        message:
          type: string
          title: Message
        period_ids:
          items:
            type: string
          type: array
          title: Period Ids
      type: object
      required:
      - field
      - message
      title: PlanningIssue
    ProfilePatch:
      properties:
        expected_version:
          type: integer
          minimum: 0.0
          title: Expected Version
        application_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Application Date
        time_zone:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Time Zone
        weekly_hours:
          anyOf:
          - type: number
            maximum: 168.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Weekly Hours
        occupational_status:
          anyOf:
          - $ref: '#/components/schemas/OccupationalStatus'
          - type: 'null'
        school_category:
          anyOf:
          - $ref: '#/components/schemas/SchoolCategory'
          - type: 'null'
        education:
          anyOf:
          - $ref: '#/components/schemas/EducationPatch'
          - type: 'null'
        confirm_education_context:
          type: boolean
          title: Confirm Education Context
          default: false
      additionalProperties: false
      type: object
      required:
      - expected_version
      title: ProfilePatch
    ProfileView:
      properties:
        version:
          type: integer
          title: Version
        application_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Application Date
        application_time_zone:
          anyOf:
          - type: string
          - type: 'null'
          title: Application Time Zone
        weekly_hours:
          anyOf:
          - type: number
          - type: 'null'
          title: Weekly Hours
        availability_periods:
          items:
            $ref: '#/components/schemas/AvailabilityPeriod'
          type: array
          title: Availability Periods
        planning_revision:
          type: integer
          title: Planning Revision
          default: 0
        occupational_status:
          anyOf:
          - $ref: '#/components/schemas/OccupationalStatus'
          - type: 'null'
        school_category:
          anyOf:
          - $ref: '#/components/schemas/SchoolCategory'
          - type: 'null'
        education_context:
          anyOf:
          - type: string
            enum:
            - current
            - last
          - type: 'null'
          title: Education Context
        education_review_required:
          type: boolean
          title: Education Review Required
          default: false
        education:
          $ref: '#/components/schemas/EducationView'
        current_study_year:
          anyOf:
          - type: integer
          - type: 'null'
          title: Current Study Year
      type: object
      required:
      - version
      title: ProfileView
    SavedInstitution:
      properties:
        kind:
          type: string
          enum:
          - catalogue
          - custom
          title: Kind
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        name:
          type: string
          title: Name
        country_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Country Code
        snapshot_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Snapshot Date
      type: object
      required:
      - kind
      - name
      title: SavedInstitution
    SchoolCategory:
      type: string
      enum:
      - secondary
      - ite
      - polytechnic
      - junior_college
      - university
      title: SchoolCategory
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
