[project]
name = "elo-cv-service"
version = "0.1.0"
description = "Saved owner-scoped CV extraction, review and clarification."
requires-python = ">=3.12"
dependencies = ["elo-shared==0.1.0", "pydantic==2.14.1", "fastapi==0.162.0", "uvicorn==0.54.0", "pymongo==4.19.0", "httpx==0.28.1", "pypdf==6.21.4", "python-multipart==0.0.32", "defusedxml==0.7.1", "langgraph==1.2.17"]

[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = ["pytest==8.4.2"]
lint = ["ruff==0.11.13"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff.lint]
preview = true
select = ["PLC0415"]

[tool.ruff.lint.per-file-ignores]
"app/workers/parse.py" = ["PLC0415"]

[tool.vulture]
paths = ["app"]
exclude = ["app/schemas/"]
ignore_decorators = ["@router.*", "@app.*", "@field_validator", "@model_validator"]
ignore_names = ["model_config", "put_writes", "delete_thread", "new_versions", "task_path", "partial_notices", "needs_repair", "repair_attempts"]
min_confidence = 60
