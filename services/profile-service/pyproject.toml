# Profile runtime and test dependencies.
[project]
name = "elo-profile-service"
version = "0.0.0"
description = "elo profile service: occupational status, education category and school snapshots."
requires-python = ">=3.12"
dependencies = ["elo-shared==0.1.0", "fastapi==0.162.0", "uvicorn==0.54.0", "pymongo==4.19.0", "google-auth==2.62.0", "requests==2.34.2", "argon2-cffi==25.1.0", "email-validator==2.3.0"]

[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = ["pytest==8.4.2", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.setuptools.package-data]
app = ["data/*.json", "data/*.txt", "data/*.md"]
