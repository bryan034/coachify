# Temporary source-preview service; no database or AI dependencies.
[project]
name = "coachify-career-service"
version = "0.0.0"
description = "Authenticated, temporary job-description previews."
requires-python = ">=3.12"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "httpx==0.28.1", "beautifulsoup4==4.15.0", "pypdf==6.21.2", "python-multipart==0.0.32", "defusedxml==0.7.1"]

[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
