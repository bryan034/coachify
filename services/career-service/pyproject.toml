# Career previews, structured analysis contracts and provider adapter.
[project]
name = "elo-career-service"
version = "0.0.0"
description = "Temporary job previews, provider adapter and structured analysis contracts."
requires-python = ">=3.12"
dependencies = ["elo-shared==0.1.0", "fastapi==0.162.0", "uvicorn==0.54.0", "httpx==0.28.1", "beautifulsoup4==4.15.0", "playwright==1.64.1", "pypdf==6.21.2", "python-multipart==0.0.32", "defusedxml==0.7.1", "pydantic==2.14.1", "pymongo==4.19.0", "langgraph==1.2.17", "langgraph-checkpoint-mongodb==0.5.1", "tiktoken==0.12.0"]

[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.setuptools.package-data]
app = ["data/*.json"]
