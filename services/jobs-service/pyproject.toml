[project]
name = "elo-jobs-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["elo-shared==0.1.0", "pydantic==2.14.1", "fastapi==0.162.0", "uvicorn==0.54.0", "pymongo==4.19.0", "httpx==0.28.1"]
[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"
[project.optional-dependencies]
test = ["pytest==9.2.0", "mongomock==4.3.0"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.setuptools.package-data]
app = ["sources.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["tests"]

[tool.vulture]
paths = ["app"]
exclude = ["app/schemas.py"]
ignore_decorators = ["@router.*", "@app.*", "@field_validator", "@model_validator"]
ignore_names = ["handle_starttag", "handle_endtag", "handle_data", "attrs", "model_config"]
min_confidence = 60
