[project]
name = "elo-roadmap-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["elo-shared==0.1.0", "pydantic==2.14.1", "fastapi==0.162.0", "uvicorn==0.54.0", "pymongo==4.19.0", "httpx==0.28.1"]
[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"
[project.optional-dependencies]
test = ["pytest==9.2.0"]
lint = ["ruff==0.17.6", "vulture==2.16"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["tests"]
[tool.ruff]
target-version = "py312"
[tool.ruff.lint]
select = ["ARG", "PLC0415", "S110", "SIM105", "BLE001"]
dummy-variable-rgx = "^(_+|_[A-Za-z0-9_]+|request)$"
[tool.vulture]
paths = ["app"]
exclude = ["app/schemas/"]
ignore_decorators = ["@app.get", "@app.post", "@app.patch"]
min_confidence = 60
