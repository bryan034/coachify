[project]
name = "elo-roadmap-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["elo-shared==0.1.0", "pydantic==2.14.1", "fastapi==0.162.0", "uvicorn==0.54.0", "pymongo==4.19.0", "httpx==0.28.1"]
[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"
[project.optional-dependencies]
test = ["pytest==8.4.2"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
