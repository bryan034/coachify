[project]
name = "elo-review-service"
version = "0.0.0"
description = "Structure-only review and scheduling service; planned FastAPI application."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.vulture]
paths = ["app"]
exclude = ["app/schemas/"]
ignore_decorators = ["@router.*", "@app.*", "@field_validator", "@model_validator"]
min_confidence = 60
