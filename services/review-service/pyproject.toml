# Structure-only project metadata. Select and pin dependencies before implementation.
[project]
name = "coachify-review-service"
version = "0.0.0"
description = "Structure-only review and scheduling service; planned FastAPI application."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
